<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="POST" autocomplete="on"></form>
    <div>
        <label for="iusu">Usuário:</label>
        <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" size="11" placeholder="nome do usuário" autocomplete="username">
        <!-- REQUIRED significa requerido ou obrigatório --div
        <!- Min/Max lenght correspondem a quantidade de carctéres -->
        <!-- Use o SIZE para mudar o tamanho da caixa -->
        <!-- PLACEHOLDER é uma sugestão que você bota para o usuário.-->
    </div>
    <p>
        <label for="isen">Senha:</label>
        <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" 
        placeholder="mínimo 8 letras" autocomplete="new-password">
        <!--Password = Senha -->
        <!--Current-Password = senha atual-->
    </p>
   
    <p>
      <input type="submit" value="Enviar"> <!-- Botão de Subimissão!-->
      <input type="reset" value="Limpar"> <!-- Botão de Limpar -->
    </p>
  
</body>
</html>
