<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo do Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
       <fieldset>
        <legend>Gênero</legend>
        <!-- Todo o botão de rádio que faz parte do mesmo grupo tem que ter o mesmo name-->

        <input type="radio" name="sexo" id="imas"><label for="imas" value="M">Masculino</label><br>
        <input type="radio" name="sexo" id="ifem"><label for="ifem"checked value="F">Feminino</label>
      
        </fieldset>

        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="esbas" id="iesbas"><label for="iesbas">Basquete</label><br>
            <input type="checkbox" name="esfut" id="iesfut"><label for="iesfut">Futebol</label><br>
            <input type="checkbox" name="esnat" id="iesnat"><label for="iesnat">Natação</label><br>
            <input type="checkbox" name="esten" id="iesten"><label for="iesten">Tênis</label>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
    
</body>
</html>
